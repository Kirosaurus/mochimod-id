name: Deploy Alwaysdata

on:
  push:
    branches:
      - deploy2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ALWAYSDATA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ALWAYSDATA_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='database/*.sqlite*' \
            --exclude='storage/' \
            --exclude='storage/logs/*.log' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            --exclude='bootstrap/cache/*.php' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            ./ "${{ secrets.ALWAYSDATA_SSH_USER }}@${{ secrets.ALWAYSDATA_SSH_HOST }}:${{ secrets.ALWAYSDATA_REMOTE_PATH }}/"

      - name: Run Laravel deploy commands
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.ALWAYSDATA_SSH_USER }}@${{ secrets.ALWAYSDATA_SSH_HOST }}" \
            "cd '${{ secrets.ALWAYSDATA_REMOTE_PATH }}' && bash scripts/deploy-alwaysdata.sh"
